<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>การเดินทางของอาหารในระบบย่อยอาหาร · ห้องเรียนจำลอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/lab.css">
<style>
  .simpage .stage canvas { height: 600px; }
  @media (max-width: 900px) { .simpage .stage canvas { height: 560px; } }
  .organs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 6px 0; }
  .organs .btn { padding: 5px 4px; font-size: 15px; }
  .info { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 15px; margin-top: 10px; }
  .info h4 { margin: 0 0 4px; font-size: 18px; }
  .info p { margin: 4px 0; }
  .info .tag { display: inline-block; font-size: 13px; padding: 0 8px; border-radius: 999px; font-weight: 600; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; font-size: 14px; margin-top: 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../assets/lab.js"></script>
<script src="../../assets/simkit.js"></script>
<script>
// ขั้นการเดินทางของอาหาร: จุดบนเส้นทาง (พิกัดออกแบบ 400 × 640) และความรู้ประกอบ
const STAGES = [
  { key: 'mouth', name: 'ปาก', pts: [[200, 96], [200, 96]], real: 4, sec: 25, time: 'ประมาณ 20–30 วินาที (เคี้ยว)',
    mech: 'ฟันบดเคี้ยวให้ชิ้นเล็กลง ลิ้นคลุกอาหารกับน้ำลาย', chem: 'น้ำลายมีเอนไซม์ย่อยแป้งบางส่วนให้เป็นน้ำตาล', nut: 'แป้ง (บางส่วน)' },
  { key: 'pharynx', name: 'คอหอย', pts: [[200, 96], [200, 112], [200, 136]], real: 1.4, sec: 1, time: 'ประมาณ 1 วินาที',
    mech: 'กลืนอาหาร ฝาปิดกล่องเสียงปิดไม่ให้อาหารลงหลอดลม', chem: 'ไม่มีการย่อย', nut: '—' },
  { key: 'eso', name: 'หลอดอาหาร', pts: [[200, 136], [202, 190], [205, 250]], real: 2.6, sec: 8, time: 'ประมาณ 5–10 วินาที',
    mech: 'กล้ามเนื้อบีบตัวเป็นจังหวะ ดันอาหารลงสู่กระเพาะ', chem: 'ไม่มีการย่อย', nut: '—' },
  { key: 'stomach', name: 'กระเพาะอาหาร', pts: [[205, 250], [228, 262], [256, 274], [266, 296], [250, 318], [222, 326]], real: 6, sec: 3 * 3600, time: 'ประมาณ 2–4 ชั่วโมง',
    mech: 'กล้ามเนื้อบีบตัวคลุกเคล้าอาหารกับน้ำย่อยจนเหลวข้น', chem: 'น้ำย่อยและกรดในกระเพาะย่อยโปรตีนบางส่วน', nut: 'โปรตีน (บางส่วน)' },
  { key: 'small', name: 'ลำไส้เล็ก', pts: [[222, 326], [206, 342], [196, 362], [160, 402], [250, 412], [155, 428], [252, 440], [152, 456], [250, 470], [154, 486], [248, 500], [140, 512], [126, 516]], real: 9, sec: 4 * 3600, time: 'ประมาณ 3–5 ชั่วโมง',
    mech: 'บีบตัวคลุกเคล้า และน้ำดีจากตับทำให้ไขมันแตกเป็นหยดเล็ก ๆ', chem: 'เอนไซม์จากตับอ่อนและผนังลำไส้เล็กย่อยแป้ง โปรตีน และไขมันจนสมบูรณ์', nut: 'แป้ง โปรตีน ไขมัน ย่อยสมบูรณ์ แล้วดูดซึมเข้าสู่เลือด' },
  { key: 'large', name: 'ลำไส้ใหญ่', pts: [[126, 516], [122, 470], [120, 420], [124, 386], [200, 380], [276, 386], [280, 432], [278, 492], [262, 526], [226, 546], [206, 560]], real: 7, sec: 18 * 3600, time: 'ประมาณ 12–24 ชั่วโมงหรือนานกว่า',
    mech: 'บีบตัวดันกากอาหารไปทางทวารหนัก', chem: 'ไม่มีการย่อย ดูดน้ำและแร่ธาตุบางชนิดกลับเข้าสู่ร่างกาย กากอาหารจึงข้นขึ้น', nut: '— (ดูดน้ำกลับ)' },
  { key: 'anus', name: 'ทวารหนัก', pts: [[206, 560], [202, 576], [200, 600]], real: 2.4, sec: 0, time: 'ขับถ่ายเมื่อกากอาหารเต็มลำไส้ตรง',
    mech: 'ขับกากอาหาร (อุจจาระ) ออกจากร่างกาย', chem: '—', nut: '—' },
];
// ส่วนประกอบของคำอาหาร (ชนิด, สี)
const KINDS = {
  starch: { col: '#f3efe2', name: 'แป้ง' }, sugar: { col: '#ffffff', name: 'น้ำตาล (แป้งที่ถูกย่อย)' },
  protein: { col: '#e88b98', name: 'โปรตีน' }, fat: { col: '#f2c94c', name: 'ไขมัน' },
  fiber: { col: '#5aa55a', name: 'ใยอาหาร' }, water: { col: '#6aaef0', name: 'น้ำ' },
};

SimKit.page({
  id: 'digestion',
  title: 'การเดินทางของอาหารในระบบย่อยอาหาร',
  level: 'ป.6',
  subject: 'สิ่งมีชีวิต',
  lead: 'ติดตามอาหารหนึ่งคำตั้งแต่ปากจนถึงทวารหนัก ดูว่าแต่ละอวัยวะย่อยอาหารแบบใด สารอาหารใดถูกย่อย และอาหารอยู่ในแต่ละอวัยวะนานเท่าใด',
  about:
    '<p><b>ทางเดินอาหาร</b>: ปาก → คอหอย → หลอดอาหาร → กระเพาะอาหาร → ลำไส้เล็ก → ลำไส้ใหญ่ → ทวารหนัก</p>' +
    '<p><b>การย่อยเชิงกล</b> ทำให้อาหารชิ้นเล็กลง เช่น การเคี้ยว การบีบตัวของกระเพาะ · <b>การย่อยเชิงเคมี</b> ใช้น้ำย่อย (เอนไซม์) เปลี่ยนสารอาหารโมเลกุลใหญ่ให้เป็นโมเลกุลเล็กที่ร่างกายดูดซึมได้</p>' +
    '<p><b>ตับ</b>สร้างน้ำดีเก็บไว้ที่<b>ถุงน้ำดี</b> น้ำดีไม่ใช่เอนไซม์ แต่ช่วยให้ไขมันแตกเป็นหยดเล็ก ๆ · <b>ตับอ่อน</b>สร้างน้ำย่อยส่งเข้าลำไส้เล็ก ทั้งสองอวัยวะช่วยย่อย แต่อาหารไม่ได้ผ่านเข้าไป</p>' +
    '<p>อาหารที่ย่อยสมบูรณ์ถูก<b>ดูดซึมที่ลำไส้เล็ก</b> ส่วนลำไส้ใหญ่ดูดน้ำกลับ กากที่เหลือ (ใยอาหาร) ถูกขับออกทางทวารหนัก</p>' +
    '<p class="muted" style="font-size:14px">เวลาในภาพเป็นเวลาโดยประมาณ แต่ละคนและอาหารแต่ละชนิดใช้เวลาต่างกัน ภาพเคลื่อนไหวเร่งให้ดูทันในคาบเรียน</p>',
  think: [
    'อวัยวะใดมีทั้งการย่อยเชิงกลและเชิงเคมี',
    'ทำไมอาหารอยู่ในลำไส้เล็กนานกว่าในหลอดอาหารมาก',
    'ตับและตับอ่อนไม่ได้เป็นทางผ่านของอาหาร แต่ทำไมจึงจัดอยู่ในระบบย่อยอาหาร',
    'ถ้าดื่มน้ำน้อยและกินผักน้อย กากอาหารในลำไส้ใหญ่จะเป็นอย่างไร',
  ],
  build(stage, panel, api) {
    stage.innerHTML = '<canvas></canvas>';
    const cv = Lab.canvas(stage.querySelector('canvas'));
    panel.innerHTML =
      '<div class="row"><button class="btn primary" id="play">▶ เล่น</button><button class="btn" id="reset">เริ่มใหม่</button></div>' +
      '<div class="row"><button class="btn" id="prev">◀ ขั้นก่อน</button><button class="btn" id="next">ขั้นถัดไป ▶</button></div>' +
      '<h3>ความเร็ว</h3><div class="seg" id="spd"><button data-v="0.5">ช้า</button><button data-v="1">ปกติ</button><button data-v="2">เร็ว</button></div>' +
      '<h3>ไปที่อวัยวะ</h3><div class="organs">' + STAGES.map((st, i) => '<button class="btn" data-i="' + i + '">' + st.name + '</button>').join('') + '</div>' +
      '<label style="display:flex;gap:8px;align-items:center;font-size:15px;margin:6px 0"><input type="checkbox" id="lbl" checked> แสดงชื่ออวัยวะ</label>' +
      '<div class="info" id="info"></div>' +
      '<div class="legend">' + ['starch', 'sugar', 'protein', 'fat', 'fiber', 'water'].map((k) => '<span><i style="background:' + KINDS[k].col + ';border:1px solid #999"></i>' + KINDS[k].name + '</span>').join('') + '</div>';
    const $ = (q) => panel.querySelector(q);
    const s = { si: 0, p: 0, play: false, speed: 1, labels: true };
    // คำอาหาร: อนุภาคชนิดต่าง ๆ เรียงรอบจุดศูนย์กลาง
    const rng = api.rng;
    const parts = [];
    [['starch', 6], ['protein', 4], ['fat', 3], ['fiber', 3], ['water', 5]].forEach(([k, n]) => {
      for (let i = 0; i < n; i++) parts.push({ k, a: rng() * 6.283, r: 0.25 + 0.75 * Math.sqrt(rng()), sz: 0.8 + 0.4 * rng(), sweet: k === 'starch' && i % 3 === 0 });
    });
    const syncBtns = () => {
      $('#play').textContent = s.play ? '❚❚ หยุด' : '▶ เล่น';
      $('#spd').querySelectorAll('button').forEach((b) => b.classList.toggle('on', +b.dataset.v === s.speed));
      panel.querySelectorAll('[data-i]').forEach((b) => b.classList.toggle('on', +b.dataset.i === s.si));
      const st = STAGES[s.si];
      $('#info').innerHTML = '<h4>' + (s.si + 1) + '. ' + st.name + '</h4>' +
        '<p><span class="tag" style="background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)">เชิงกล</span> ' + st.mech + '</p>' +
        '<p><span class="tag" style="background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)">เชิงเคมี</span> ' + st.chem + '</p>' +
        '<p><b>สารอาหารที่ถูกย่อย:</b> ' + st.nut + '</p><p><b>เวลา:</b> ' + st.time + '</p>';
    };
    $('#play').onclick = () => { if (s.si === STAGES.length - 1 && s.p >= 1) { s.si = 0; s.p = 0; } s.play = !s.play; syncBtns(); };
    $('#reset').onclick = () => { s.si = 0; s.p = 0; s.play = false; syncBtns(); };
    $('#prev').onclick = () => { s.si = Math.max(0, s.si - (s.p < 0.05 ? 1 : 0)); s.p = 0; s.play = false; syncBtns(); };
    $('#next').onclick = () => { if (s.si < STAGES.length - 1) { s.si++; s.p = 0; } else s.p = 1; s.play = false; syncBtns(); };
    $('#spd').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { s.speed = +b.dataset.v; syncBtns(); } });
    panel.querySelector('.organs').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) { s.si = +b.dataset.i; s.p = 0; s.play = false; syncBtns(); } });
    $('#lbl').onchange = (e) => { s.labels = e.target.checked; };
    syncBtns();

    // ---------- เรขาคณิต ----------
    let T = { k: 1, ox: 0, oy: 0 };
    function layout() { const k = Math.min(cv.h / 640, cv.w / 420); T = { k, ox: (cv.w - 400 * k) / 2, oy: (cv.h - 640 * k) / 2 }; }
    const X = (x) => T.ox + x * T.k, Y = (y) => T.oy + y * T.k;
    function along(pts, t) {
      let L = 0; const seg = [];
      for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
      if (L === 0) return pts[0];
      let d = t * L;
      for (let i = 0; i < seg.length; i++) { if (d <= seg[i]) { const u = d / seg[i]; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * u, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * u]; } d -= seg[i]; }
      return pts[pts.length - 1];
    }
    function tubePath(ctx, pts, w, col) {
      ctx.strokeStyle = col; ctx.lineWidth = w * T.k; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)))); ctx.stroke();
    }
    function blob(ctx, pts, col, stroke) {
      ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)))); ctx.closePath();
      ctx.fillStyle = col; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
    }
    const active = (key) => STAGES[s.si].key === key;
    const hl = (key, base, on) => (active(key) ? on : base);

    function scene() {
      const ctx = cv.ctx, dark = Lab.dark(), ink = Lab.css('--ink'), muted = Lab.css('--muted');
      ctx.clearRect(0, 0, cv.w, cv.h);
      const now = performance.now() / 1000;
      // ลำตัว
      ctx.fillStyle = dark ? '#3a3226' : '#f6dcc4'; ctx.strokeStyle = dark ? '#6b5a45' : '#d8b494'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(X(200), Y(70), 56 * T.k, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillRect(X(176), Y(120), 48 * T.k, 40 * T.k);
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(X(88), Y(150), 224 * T.k, 465 * T.k, 60 * T.k) : ctx.rect(X(88), Y(150), 224 * T.k, 465 * T.k); ctx.fill(); ctx.stroke();
      // ปาก
      ctx.fillStyle = hl('mouth', '#c0504d', '#ff3b30'); ctx.beginPath(); ctx.ellipse(X(200), Y(96), 16 * T.k, 6 * T.k, 0, 0, 7); ctx.fill();
      // ตับและถุงน้ำดี (ผู้ช่วย)
      const smallOn = active('small') && s.p < 0.55;
      const liverPts = [[104, 238], [150, 226], [214, 232], [222, 252], [196, 276], [150, 300], [112, 294], [98, 266]];
      blob(ctx, liverPts, smallOn ? 'rgba(170,70,50,.95)' : 'rgba(150,60,45,.75)', smallOn ? '#ffd27a' : null);
      ctx.fillStyle = '#5c9a3c'; ctx.beginPath(); ctx.ellipse(X(178), Y(300), 10 * T.k, 15 * T.k, 0.3, 0, 7); ctx.fill();
      // หลอดอาหาร คอหอย
      tubePath(ctx, [[200, 100], [200, 136], [202, 190], [205, 250]], 12, hl('eso', '#d98c7c', '#ff8a73'));
      if (active('pharynx')) tubePath(ctx, [[200, 100], [200, 136]], 14, '#ff8a73');
      // กระเพาะ
      const sq = active('stomach') ? 1 + 0.04 * Math.sin(now * 5) : 1;
      const stPts = [[205, 248], [232, 248], [272, 264], [290, 296], [278, 330], [248, 342], [218, 336], [208, 320], [236, 312], [250, 296], [240, 276], [214, 266]]
        .map(([x, y]) => [248 + (x - 248) * sq, 296 + (y - 296) * sq]);
      blob(ctx, stPts, hl('stomach', 'rgba(222,140,130,.9)', 'rgba(255,130,110,.95)'), dark ? '#7a4a40' : '#b56a5c');
      // ตับอ่อน
      blob(ctx, [[192, 340], [236, 334], [274, 340], [270, 352], [232, 352], [196, 354]], smallOn ? 'rgba(250,215,150,1)' : 'rgba(235,200,150,.85)', smallOn ? '#e09a2c' : null);
      // ลำไส้ใหญ่ (กรอบ)
      tubePath(ctx, STAGES[5].pts, 22, hl('large', 'rgba(190,140,110,.9)', 'rgba(220,150,110,1)'));
      // ลำไส้เล็ก (ขด)
      tubePath(ctx, STAGES[4].pts.slice(1), 13, hl('small', 'rgba(232,160,150,.95)', 'rgba(255,165,140,1)'));
      // ลำไส้ตรงและทวารหนัก
      tubePath(ctx, STAGES[6].pts, 16, hl('anus', 'rgba(190,140,110,.9)', 'rgba(220,150,110,1)'));
      // น้ำดีและน้ำย่อยไหลเข้าลำไส้เล็กส่วนต้น
      if (smallOn) {
        ctx.setLineDash([5, 5]); ctx.lineDashOffset = -now * 30; ctx.lineWidth = 3;
        ctx.strokeStyle = '#4caf50'; ctx.beginPath(); ctx.moveTo(X(180), Y(314)); ctx.quadraticCurveTo(X(190), Y(335), X(205), Y(342)); ctx.stroke();
        ctx.strokeStyle = '#e09a2c'; ctx.beginPath(); ctx.moveTo(X(230), Y(345)); ctx.lineTo(X(208), Y(346)); ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = '600 ' + 13 + 'px Sarabun, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#2e7d32'; ctx.fillText('น้ำดี', X(170), Y(328));
        ctx.textAlign = 'left'; ctx.fillStyle = '#b26a00'; ctx.fillText('น้ำย่อยจากตับอ่อน', X(282), Y(372));
      }
      // ชื่ออวัยวะ
      if (s.labels) {
        const L = [['ปาก', 248, 96, 'mouth'], ['คอหอย', 248, 124, 'pharynx'], ['หลอดอาหาร', 248, 196, 'eso'], ['กระเพาะอาหาร', 300, 300, 'stomach'],
          ['ตับ', 70, 258, ''], ['ถุงน้ำดี', 70, 310, ''], ['ตับอ่อน', 282, 344, ''], ['ลำไส้เล็ก', 200, 452, 'small'], ['ลำไส้ใหญ่', 70, 430, 'large'], ['ทวารหนัก', 250, 600, 'anus']];
        ctx.textBaseline = 'middle';
        L.forEach(([t, x, y, key]) => {
          const on = key && active(key);
          ctx.font = (on ? '700 ' : '600 ') + Math.round((on ? 16 : 13.5) * Math.max(0.85, T.k)) + 'px Sarabun, sans-serif';
          ctx.textAlign = x < 120 ? 'right' : x > 240 ? 'left' : 'center';
          const xx = x < 120 ? X(x + 18) : X(x);
          ctx.lineWidth = 3; ctx.strokeStyle = dark ? 'rgba(20,24,30,.8)' : 'rgba(255,255,255,.85)'; ctx.strokeText(t, xx, Y(y));
          ctx.fillStyle = on ? Lab.css('--accent') : ink; ctx.fillText(t, xx, Y(y));
        });
      }
      // คำอาหาร
      const st = STAGES[s.si];
      let pos = along(st.pts, s.p);
      if (st.key === 'mouth') pos = [200 + Math.sin(now * 9) * 2, 96];
      if (st.key === 'stomach') { const c = along(st.pts, Math.min(1, s.p * 1.4)); pos = s.p < 0.7 ? [248 + Math.sin(now * 3) * 14 * (1 - s.p), 296 + Math.cos(now * 2.6) * 10 * (1 - s.p)] : c; }
      const g = s.si + s.p;
      if (!(st.key === 'anus' && s.p >= 0.98)) drawBolus(ctx, pos, g, now);
      else { ctx.fillStyle = muted; ctx.font = '600 15px Sarabun, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('ขับกากอาหารออกแล้ว', X(200), Y(625)); }
      // เวลาจำลอง
      let sec = 0; for (let i = 0; i < s.si; i++) sec += STAGES[i].sec; sec += STAGES[s.si].sec * s.p;
      const hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60), ss2 = Math.floor(sec % 60);
      ctx.fillStyle = ink; ctx.font = '600 17px Sarabun, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('เวลาตั้งแต่กินเข้าไป ≈ ' + (hh ? hh + ' ชม. ' + mm + ' นาที' : mm ? mm + ' นาที ' + ss2 + ' วินาที' : ss2 + ' วินาที'), 12, 10);
    }

    // ลักษณะของอนุภาคตามขั้น g = ขั้น + ความคืบหน้า (0–7)
    function drawBolus(ctx, pos, g, now) {
      const spread = (g < 1 ? 1 - 0.35 * g : g < 3 ? 0.65 : g < 4 ? 0.65 + 0.25 * (g - 3) : g < 5 ? 0.9 : g < 6 ? 0.9 - 0.4 * (g - 5) : 0.5) * 22;
      // วงแสงรอบคำอาหาร ให้มองเห็นชัดบนจอฉาย
      const halo = ctx.createRadialGradient(X(pos[0]), Y(pos[1]), 2, X(pos[0]), Y(pos[1]), (spread + 18) * T.k);
      halo.addColorStop(0, 'rgba(255,255,255,.75)'); halo.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(X(pos[0]), Y(pos[1]), (spread + 18) * T.k, 0, 7); ctx.fill();
      // พื้นหลังของเหลวข้นในกระเพาะและลำไส้เล็ก
      if (g >= 3 && g < 5) { ctx.fillStyle = 'rgba(230,200,120,.35)'; ctx.beginPath(); ctx.arc(X(pos[0]), Y(pos[1]), (spread + 8) * T.k, 0, 7); ctx.fill(); }
      parts.forEach((pt, i) => {
        let k = pt.k, sz = pt.sz, alpha = 1, n = 1;
        const solid = g < 1 ? 1 - 0.4 * g : 0.6;
        if (k === 'starch') {
          if (pt.sweet && g > 0.5) { k = 'sugar'; sz = 0.45; }
          else sz *= g < 4 ? solid : 0.6 - 0.3 * Math.min(1, g - 4);
          if (g > 4) alpha = 1 - Math.min(1, (g - 4) / 0.9);
        } else if (k === 'protein') {
          sz *= g < 3 ? solid : g < 4 ? 0.6 - 0.3 * (g - 3) : 0.3;
          if (g > 4) alpha = 1 - Math.min(1, (g - 4.1) / 0.8);
        } else if (k === 'fat') {
          sz *= g < 4 ? 0.8 : 0.35;
          if (g > 4.05) n = 4; // น้ำดีทำให้ไขมันแตกเป็นหยดเล็ก
          if (g > 4.4) alpha = 1 - Math.min(1, (g - 4.4) / 0.55);
        } else if (k === 'fiber') {
          sz *= g < 1 ? 1 - 0.3 * g : 0.7;
        } else if (k === 'water') {
          sz *= 0.6; if (g > 5) alpha = 1 - Math.min(0.85, (g - 5) * 0.9);
        }
        if (alpha <= 0.02) return;
        let col = KINDS[k].col;
        if (k === 'fiber' && g > 5) col = '#7a6a3a';
        const wob = g >= 3 && g < 4 ? Math.sin(now * 4 + i) * 2 : 0;
        for (let j = 0; j < n; j++) {
          const a = pt.a + j * 1.6, rr = pt.r * spread + (n > 1 ? 4 : 0);
          const x = X(pos[0] + Math.cos(a) * rr + wob), y = Y(pos[1] + Math.sin(a) * rr);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = col; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1;
          if (k === 'fiber') { ctx.save(); ctx.translate(x, y); ctx.rotate(pt.a); ctx.fillRect(-9 * sz * T.k, -2.5 * T.k, 18 * sz * T.k, 5 * T.k); ctx.restore(); }
          else { ctx.beginPath(); ctx.arc(x, y, Math.max(2, 7.5 * sz * T.k), 0, 7); ctx.fill(); ctx.stroke(); }
          // สารอาหารที่ถูกดูดซึมลอยออกจากลำไส้เล็กเข้าสู่เลือด
          if (g > 4 && g < 5 && alpha < 0.9 && k !== 'fiber' && k !== 'water') {
            ctx.fillStyle = '#d23a3a'; ctx.beginPath(); ctx.arc(x + (1 - alpha) * 22 * T.k, y - (1 - alpha) * 18 * T.k, 2.2 * T.k, 0, 7); ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
      });
    }

    Lab.loop((dt) => {
      if (!cv.w) return;
      layout();
      if (s.play) {
        s.p += (dt * s.speed) / STAGES[s.si].real;
        if (s.p >= 1) {
          if (s.si < STAGES.length - 1) { s.si++; s.p = 0; syncBtns(); }
          else { s.p = 1; s.play = false; syncBtns(); }
        }
      }
      scene();
    });
  },
});
</script>
